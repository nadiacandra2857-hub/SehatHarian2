buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://sandec.jfrog.io/artifactory/repo" }
    }
    dependencies {
        classpath "one.jpro:jpro-gradle-plugin:2026.3.0"
    }
}

plugins {
    id 'application'
    id 'java'
}

apply plugin: 'jpro-gradle-plugin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
    maven { url "https://sandec.jfrog.io/artifactory/repo" }
}

def javafxVersion = '24.0.1'
def osName = System.getProperty('os.name').toLowerCase()
def arm64 = System.getProperty('os.arch') in ['aarch64', 'arm64']
def javafxPlatform = osName.contains('win') ? 'win' :
    (osName.contains('mac') ? (arm64 ? 'mac-aarch64' : 'mac') : (arm64 ? 'linux-aarch64' : 'linux'))

dependencies {
    // JPro WebAPI
    implementation 'one.jpro:jpro-webapi:2026.3.0'

    // JavaFX natives for the current operating system
    implementation "org.openjfx:javafx-base:${javafxVersion}"
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-media:${javafxVersion}"
    implementation "org.openjfx:javafx-media:${javafxVersion}:${javafxPlatform}"

    // MySQL JDBC Connector
    implementation 'com.mysql:mysql-connector-j:9.3.0'

    // BCrypt password hashing
    implementation 'org.mindrot:jbcrypt:0.4'

    // Backend2 module dependency
    implementation project(':Backend2')

    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.sehatharian.AppLauncher'
    applicationDefaultJvmArgs = [
        '--enable-preview',
        '--enable-native-access=ALL-UNNAMED'
    ]
}

jpro {
    // default port is 8080
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

test {
    useJUnitPlatform()
    jvmArgs(['--enable-preview'])
}

// Keep local runtime data and launcher lookup rooted in the project directory.
tasks.named('run', JavaExec) {
    workingDir rootProject.projectDir
}
